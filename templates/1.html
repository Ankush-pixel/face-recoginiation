<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        .loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .loader div {
            border: 5px solid white;
            border-top: 5px solid blue;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Face Recognition System</h1>
    <button onclick="startCamera()">📷 Open Camera</button>
    <video id="camera-feed" autoplay style="display:none;"></video>
    <canvas id="captured-canvas" style="display:none;"></canvas>
    <button onclick="capturePhoto()">📸 Capture</button>
    <button onclick="showPreview()">Preview Images</button>
    <div id="preview-container" style="display:none;">
        <img id="preview-image" src="" style="max-width:100px;">
    </div>
    <script>
        let videoStream;
        let capturedImage;
        
        function startCamera() {
            const video = document.getElementById('camera-feed');
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    videoStream = stream;
                    video.srcObject = stream;
                    video.style.display = 'block';
                })
                .catch(err => alert("Error accessing camera: " + err.message));
        }

        function capturePhoto() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('captured-canvas');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImage = canvas.toDataURL('image/png');
            alert("Photo captured!");
        }

        function showPreview() {
            if (!capturedImage) {
                alert("No image captured yet!");
                return;
            }
            document.getElementById('preview-image').src = capturedImage;
            document.getElementById('preview-container').style.display = 'block';
        }
    </script>
</body>
</html>
