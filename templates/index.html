<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Recognition System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; background-color: #e0e0e0; padding: 20px; color: #333;">

  <div class="container" style="max-width: 500px; margin: auto; background: #6c757d; padding: 20px; border-radius: 50px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); color: white;">
    <h1 style="color: black; display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-search" style="color: blue; margin-right: 10px;"></i> Face Recognition System
    </h1>
    <p>Upload images or take photos to compare faces.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="showLoader()">
      <input type="text" name="username" placeholder="Enter your name or ID" required>
      <div style="margin: 15px 0;">
        <label>First Image:</label>
        <div style="display: flex; justify-content: center; gap: 10px; margin: 10px 0;">
          <input type="file" name="image1" accept="image/*" onchange="previewImage(event,'preview1')" style="display: none;" id="file1">
          <button type="button" onclick="document.getElementById('file1').click()" style="background: black; color: white; padding: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <i class="fas fa-upload"></i> Upload
          </button>
          <button type="button" onclick="startCamera(1)" style="background: black; color: white; padding: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <i class="fas fa-camera"></i> Capture
          </button>
        </div>
      </div>

      <!-- Second Image -->
      <div style="margin: 15px 0;">
        <label>Second Image:</label>
        <div style="display: flex; justify-content: center; gap: 10px; margin: 10px 0;">
          <input type="file" name="image2" accept="image/*" onchange="previewImage(event,'preview2')" style="display: none;" id="file2">
          <button type="button" onclick="document.getElementById('file2').click()" style="background: black; color: white; padding: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <i class="fas fa-upload"></i> Upload
          </button>
          <button type="button" onclick="startCamera(2)" style="background: black; color: white; padding: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <i class="fas fa-camera"></i> Capture
          </button>
        </div>
      </div>

      <!-- Preview Button -->
      <button type="button" onclick="showPreview()" style="background: green; color: white; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <i class="fas fa-eye"></i> Preview
      </button>

      <!-- Model Selection -->
      <div style="margin: 20px 0;">
        <label>Select Model:</label>
        <select name="model" style="display: block; margin: 10px auto; padding: 5px; border-radius: 5px;">
          <option value="ArcFace">ArcFace</option>
          <option value="Facenet">Facenet</option>
          <option value="OpenFace">OpenFace</option>
          <option value="DeepID">DeepID</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit" style="background: blue; color: white; padding: 10px 15px; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <i class="fas fa-search"></i> Compare Faces
      </button>
    </form>

    <!-- Delete Button -->
    <button onclick="deleteImages()" style="cursor:pointer;background-color:red;color:white;margin-top:10px;padding:10px;border-radius:5px;transition:0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      <i class="fas fa-trash-alt"></i> Delete Captured
    </button>

    <!-- Loader -->
    <div class="loader" id="loader" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
      <div style="border: 5px solid white; border-top: 5px solid blue; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;"></div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container" id="progress-bar-container" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); text-align: center;">
      <p id="progress-text" style="color:grey;">Processing... 0%</p>
      <div class="progress-bar" id="progress-bar" style="width: 0%; height: 10px; background: blue; border-radius: 5px; transition: width 0.3s;"></div>
    </div>
  </div>

  <!-- Network Speed Box -->
  <!-- <div class="network-container" style="position: absolute; top: 20px; right: 20px; width: 300px; background: #2c3e50; color: white; padding: 15px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); text-align: center;">
    <h3 style="margin: 5px 0; font-size: 20px; color: cyan;">🌐 Network Speed</h3>
    <p id="network-speed-text" style="margin: 10px 0; font-size: 16px; color: #ddd;">Click below to check speed...</p>
    <button onclick="showSpeed()" style="background: linear-gradient(135deg, #ff9a9e, #fad0c4); color: black; padding: 10px 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      🚀 Check Speed
    </button>
  </div> -->

  <!-- Camera Modal -->
  <div id="camera-modal" class="modal" style="display:none; position: fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:10px; box-shadow:0px 4px 10px rgba(0,0,0,0.2); text-align:center; z-index:1000; width:500px;">
    <h3>Take Photo</h3>
    <video id="camera-feed" style="width: 100%; margin-bottom: 10px;" autoplay></video>
    <button type="button" onclick="capturePhoto()" style="background: blue; color: white; padding: 10px; border-radius: 5px; cursor: pointer; margin-right: 10px;">
      📸 Capture
    </button>
    <button type="button" onclick="closeCamera()" style="background: red; color: white; padding: 10px; border-radius: 5px; cursor: pointer;">
      ❌ Close
    </button>
  </div>

  <!-- Image Preview Dialog -->
  <div id="image-preview-dialog" class="modal" style="display:none; position: fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:10px; box-shadow:0px 4px 10px rgba(0,0,0,0.2); text-align:center; z-index:1000; width:500px;">
    <h3>Image Preview</h3>
    <div class="image-container" style="display: flex; flex-direction: row; align-items: center; justify-content: center;">
      <img id="dialog-preview1" style="max-width: 50%; height: auto; display: none; margin-bottom: 10px; border: 1px solid #ccc; padding: 5px;">
      <img id="dialog-preview2" style="max-width: 50%; height: auto; display: none; border: 1px solid #ccc; padding: 5px;">
    </div>
    <button type="button" onclick="closePreview()" title="Close Preview" style="cursor: pointer;position: absolute; top: -8px; right: -8px; background: white; border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 3px rgba(0,0,0,0.2); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
      <i class="fas fa-times" style="color: red;"></i>
    </button>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
